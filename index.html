<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report System</title>
    <style>
        :root {
            --primary: #00f2fe;
            --secondary: #4facfe;
            --bg-glass: rgba(255, 255, 255, 0.06);
            --border-glass: rgba(255, 255, 255, 0.1);
            --text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('money.gif') no-repeat center center fixed;
            background-size: cover;
            padding: 20px;
            overflow-y: auto;
            position: relative;
        }

        /* Задний темный слой для читаемости, если гифка яркая */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 10, 15, 0.75);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 550px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        h2 {
            color: var(--text);
            text-align: center;
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 24px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #ccc;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input[type="text"],
        .input-group input[type="password"],
        .input-group textarea {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            color: var(--text);
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input:focus,
        .input-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
        }

        /* Стили для чекбоксов документов */
        .docs-container {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 15px;
            max-height: 150px;
            overflow-y: auto;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            cursor: pointer;
            color: #ddd;
            font-size: 15px;
        }

        .checkbox-item:last-child {
            margin-bottom: 0;
        }

        .checkbox-item input {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.6);
        }

        button:active {
            transform: translateY(1px);
        }

        /* Панель администратора */
        .admin-panel {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 2px dashed rgba(255, 255, 255, 0.1);
        }

        .admin-title {
            color: #ff416c;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        .status-list {
            list-style: none;
        }

        .status-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 65, 108, 0.1);
            border: 1px solid rgba(255, 65, 108, 0.2);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .status-online {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
            margin-right: 6px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- ОКНО АВТОРИЗАЦИИ -->
    <div id="auth-block" class="container">
        <h2>Авторизация</h2>
        <div class="input-group">
            <label for="username">Ваш Стейдж (Имя)</label>
            <input type="text" id="username" placeholder="Введите имя...">
        </div>
        <div class="input-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" placeholder="••••">
        </div>
        <button onclick="login()">Войти</button>
    </div>

    <!-- ОСНОВНОЙ ИНТЕРФЕЙС (СКРЫТ ДО ВХОДА) -->
    <div id="main-block" class="container hidden">
        <h2 id="welcome-title">Рабочая область</h2>
        
        <form id="report-form" onsubmit="sendReport(event)">
            <div class="input-group">
                <label>Какие документы добавить в отчёт?</label>
                <div class="docs-container">
                    <label class="checkbox-item"><input type="checkbox" value="Договор купли-продажи"> Договор купли-продажи</label>
                    <label class="checkbox-item"><input type="checkbox" value="Акт приема-передачи"> Акт приема-передачи</label>
                    <label class="checkbox-item"><input type="checkbox" value="Счет-фактура"> Счет-фактура</label>
                    <label class="checkbox-item"><input type="checkbox" value="Накладная"> Накладная</label>
                    <label class="checkbox-item"><input type="checkbox" value="Дополнительное соглашение"> Дополнительное соглашение</label>
                </div>
            </div>

            <div class="input-group">
                <label for="report-text">Текст отчёта / Комментарий</label>
                <textarea id="report-text" rows="4" placeholder="Опишите проделанную работу..." required></textarea>
            </div>

            <button type="submit">Отправить отчёт</button>
        </form>

        <!-- АДМИН ПАНЕЛЬ (СКРЫТА ДЛЯ ОБЫЧНЫХ) -->
        <div id="admin-block" class="admin-panel hidden">
            <div class="admin-title">Панель управления (Айвен)</div>
            <div class="input-group">
                <label style="color: #ff4b2b;">Активность на сайте (Демо-режим):</label>
                <ul class="status-list">
                    <li class="status-item">
                        <span><span class="status-online"></span> Сотрудник Алекс</span>
                        <span style="color: #aaa;">Онлайн</span>
                    </li>
                    <li class="status-item">
                        <span><span class="status-online"></span> Сотрудник Мария</span>
                        <span style="color: #aaa;">Заполнила отчёт 5м назад</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        let currentUser = "";

        function login() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();

            if (user === "Айвен" && pass === "332211") {
                // Вход для Админа
                currentUser = user;
                document.getElementById('auth-block').classList.add('hidden');
                document.getElementById('main-block').classList.remove('hidden');
                document.getElementById('admin-block').classList.remove('hidden');
                document.getElementById('welcome-title').innerText = "Привет, Шеф!";
            } else if (user !== "" && pass === "1488") {
                // Вход для обычного сотрудника
                currentUser = user;
                document.getElementById('auth-block').classList.add('hidden');
                document.getElementById('main-block').classList.remove('hidden');
                document.getElementById('welcome-title').innerText = `Стейдж: ${currentUser}`;
            } else {
                alert("Неверное имя или пароль!");
            }
        }

        function sendReport(event) {
            event.preventDefault();
            
            // Собираем отмеченные документы
            const checkedDocs = [];
            document.querySelectorAll('.docs-container input:checked').forEach((checkbox) => {
                checkedDocs.push(checkbox.value);
            });

            const reportText = document.getElementById('report-text').value;

            // Формируем текст для отправки
            let message = `Отчёт от: ${currentUser}\n`;
            message += `Выбранные документы: ${checkedDocs.length > 0 ? checkedDocs.join(', ') : 'Нет'}\n`;
            message += `Комментарий: ${reportText}`;

            alert("Отчёт успешно сформирован!\n\n" + message);
            
            // Здесь можно оставить старый скрипт отправки в Телеграм, если он был настроен
            document.getElementById('report-form').reset();
        }
    </script>
</body>
</html>
